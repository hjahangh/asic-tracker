# Standalone production template: the hosting team supplies an authenticated MongoDB
# replica set/sharded cluster, private networking, TLS, SSO gateway and backups.
x-runtime: &runtime
  image: ${ASIC_TRACKER_IMAGE:?Set the internally approved image}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true

services:
  migrate:
    <<: *runtime
    command: [python, -m, app.migrate]
    environment:
      MONGODB_URI_FILE: /run/secrets/migration_mongodb_uri
      MONGODB_DATABASE: ${MONGODB_DATABASE:?Set the application database name}
    secrets: [migration_mongodb_uri]
    healthcheck:
      disable: true
    restart: "no"

  app:
    <<: *runtime
    environment:
      MONGODB_URI_FILE: /run/secrets/runtime_mongodb_uri
      MONGODB_DATABASE: ${MONGODB_DATABASE:?Set the application database name}
      PROXY_SHARED_SECRET_FILE: /run/secrets/proxy_shared_secret
      AUTH_MODE: proxy
      TRUSTED_HOSTS: ${TRACKER_HOSTNAME:?Set the approved internal hostname},localhost,127.0.0.1
      ROLE_GROUPS: '${ROLE_GROUPS:?Set the approved group mappings}'
      ENABLE_API_DOCS: "false"
    secrets: [runtime_mongodb_uri, proxy_shared_secret]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

secrets:
  runtime_mongodb_uri:
    file: ${MONGODB_URI_SECRET_FILE:?Set the runtime MongoDB URI secret file}
  migration_mongodb_uri:
    file: ${MONGODB_MIGRATION_URI_SECRET_FILE:?Set the schema-owner MongoDB URI secret file}
  proxy_shared_secret:
    file: ${PROXY_SHARED_SECRET_FILE:?Set the trusted gateway secret file}
