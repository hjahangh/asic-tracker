name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # MongoDB 8.0.34 rejects kernels 6.19+; current Ubuntu 24/26 runners use 7.0.
    # Reassess after a verified MongoDB/kernel upgrade, before Ubuntu 22 retires.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      MONGODB_DATABASE: asic_tracker_ci
      AUTH_MODE: development
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Show runner and container versions
        run: |
          uname -a
          docker version
          docker compose version
      - name: Start authenticated disposable MongoDB replica set
        run: |
          python3 scripts/bootstrap_dev.py
          python3 - <<'PY'
          from pathlib import Path
          import os
          values = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines() if line and not line.startswith('#'))
          for name, value in values.items():
              if name.endswith('_PASSWORD'):
                  print('::add-mask::' + value)
          uri = 'mongodb://' + values['MONGO_ROOT_USER'] + ':' + values['MONGO_ROOT_PASSWORD'] + '@127.0.0.1:27017/admin?authSource=admin&replicaSet=tracker-rs&directConnection=true'
          print('::add-mask::' + uri)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('MONGODB_URI=' + uri + '\nTEST_MONGODB_URI=' + uri + '\n')
          Path(os.environ['RUNNER_TEMP'], 'mongodb-ci.yaml').write_text('services:\n  db:\n    ports:\n      - "127.0.0.1:27017:27017"\n')
          PY
          docker compose -f compose.yaml -f "$RUNNER_TEMP/mongodb-ci.yaml" up -d --wait --wait-timeout 240 db
          docker compose -f compose.yaml -f "$RUNNER_TEMP/mongodb-ci.yaml" run --rm --no-deps setup-db
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Bootstrap and check MongoDB schema
        run: |
          python -m app.migrate
          python -m app.migrate --check
      - name: Test Python API, MongoDB persistence, planner and conversion
        run: python -m pytest backend/tests -q
      - name: Test JavaScript frontend
        run: node --test frontend/tests/*.test.cjs
      - name: Check planner conservation and browser/API parity
        run: python scripts/check_planners.py
      - name: Show database startup logs on failure
        if: failure()
        run: |
          uname -a
          if [ -f .env ] && [ -f "$RUNNER_TEMP/mongodb-ci.yaml" ]; then
            docker compose -f compose.yaml -f "$RUNNER_TEMP/mongodb-ci.yaml" ps -a
            docker compose -f compose.yaml -f "$RUNNER_TEMP/mongodb-ci.yaml" logs --no-color --tail 100 db keyfile-init setup-db
          fi
      - name: Remove disposable test database
        if: always()
        run: |
          if [ -f .env ] && [ -f "$RUNNER_TEMP/mongodb-ci.yaml" ]; then
            docker compose -f compose.yaml -f "$RUNNER_TEMP/mongodb-ci.yaml" down -v --remove-orphans
          fi

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show runner and container versions
        run: |
          uname -a
          docker version
          docker compose version
      - name: Create disposable local test credentials and keyfile
        run: python3 scripts/bootstrap_dev.py
      - name: Build and start the full stack
        run: docker compose up --build --wait --wait-timeout 240
      - name: Check served frontend and API
        run: |
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/health/ready
          curl --fail http://127.0.0.1:8080/api/me
          curl --fail http://127.0.0.1:8080/api/workspace
          curl --fail http://127.0.0.1:8080/ | grep 'ASIC Tracker'
      - name: Show logs on failure
        if: failure()
        run: |
          uname -a
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Remove disposable stack and database
        if: always()
        run: docker compose down -v --remove-orphans
