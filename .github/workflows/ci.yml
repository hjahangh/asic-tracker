name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tracker_test
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker_test -d tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: postgresql+psycopg://tracker_test:ci-only-disposable-password@127.0.0.1:5432/tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://tracker_test:ci-only-disposable-password@127.0.0.1:5432/tracker_test
      AUTH_MODE: development
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Check PostgreSQL migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Test Python API, relational storage, planner, and migration converter
        run: python -m pytest backend/tests -q
      - name: Test JavaScript frontend
        run: node --test frontend/tests/*.test.cjs
      - name: Check planner conservation and browser/API parity
        run: python scripts/check_planners.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create disposable local test credentials
        run: python3 scripts/bootstrap_dev.py
      - name: Build and start the full stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Check served frontend and API
        run: |
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/health/ready
          curl --fail http://127.0.0.1:8080/api/me
          curl --fail http://127.0.0.1:8080/api/workspace
          curl --fail http://127.0.0.1:8080/ | grep 'ASIC Tracker'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable stack and database
        if: always()
        run: docker compose down -v --remove-orphans
