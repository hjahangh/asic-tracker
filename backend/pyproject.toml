[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asic-tracker-api"
version = "0.1.0"
description = "Shared ASIC planning API for the internal tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "alembic>=1.14,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires an isolated PostgreSQL TEST_DATABASE_URL"]
